<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 100 100" role="img" aria-label="Big Downloads glass icon">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa" stop-opacity=".62"/>
      <stop offset=".48" stop-color="#5741d8" stop-opacity=".43"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity=".62"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2=".2" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#bfe4ff"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".48"/>
      <stop offset=".42" stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset dy="3" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope=".32"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect x="5" y="5" width="90" height="90" rx="22"/></clipPath>
  </defs>
  <g filter="url(#shadow)">
    <rect x="5" y="5" width="90" height="90" rx="22" fill="url(#tile)" stroke="#e6f3ff" stroke-opacity=".78" stroke-width="1.8"/>
    <g clip-path="url(#clip)">
      <path d="M2 29 Q26 1 59 4 Q82 6 99 25 V5 H5 Z" fill="url(#shine)"/>
      <path d="M7 28 Q32 5 61 9" fill="none" stroke="#ffffff" stroke-opacity=".58" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="83" cy="82" r="28" fill="#a78bfa" opacity=".13"/>
    </g>
    <circle cx="50" cy="50" r="29" fill="url(#glyph)" stroke="#eeeaff" stroke-width="2.5"/><path d="M50 31 V57 M39 47 L50 58 L61 47" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M34 68 Q50 78 66 68" fill="none" stroke="#d9d2ff" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>