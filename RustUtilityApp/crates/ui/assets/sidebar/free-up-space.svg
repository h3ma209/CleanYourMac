<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 100 100" role="img" aria-label="Free Up Space glass icon">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7de8ed" stop-opacity=".62"/>
      <stop offset=".48" stop-color="#167e8a" stop-opacity=".43"/>
      <stop offset="1" stop-color="#7de8ed" stop-opacity=".62"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2=".2" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#bfe4ff"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".48"/>
      <stop offset=".42" stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset dy="3" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope=".32"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect x="5" y="5" width="90" height="90" rx="22"/></clipPath>
  </defs>
  <g filter="url(#shadow)">
    <rect x="5" y="5" width="90" height="90" rx="22" fill="url(#tile)" stroke="#e6f3ff" stroke-opacity=".78" stroke-width="1.8"/>
    <g clip-path="url(#clip)">
      <path d="M2 29 Q26 1 59 4 Q82 6 99 25 V5 H5 Z" fill="url(#shine)"/>
      <path d="M7 28 Q32 5 61 9" fill="none" stroke="#ffffff" stroke-opacity=".58" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="83" cy="82" r="28" fill="#7de8ed" opacity=".13"/>
    </g>
    <path d="M32 30 H68 Q72 30 74 35 L85 68 Q87 75 79 77 H21 Q13 75 15 68 L26 35 Q28 30 32 30 Z" fill="url(#glyph)" stroke="#d8ffff" stroke-width="2.5"/><path d="M50 42 V61 M42 53 L50 61 L58 53" fill="none" stroke="#17516b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="72" cy="68" r="3" fill="#17516b"/>
  </g>
</svg>