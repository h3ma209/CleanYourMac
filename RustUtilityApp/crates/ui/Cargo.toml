[package]
name = "clean-your-mac"
version = "0.1.0"
edition = "2021"
description = "Mac app for disk space, caches, and downloads you choose to trash"
license = "MIT"
keywords = ["macos", "disk-usage", "cleanup", "egui"]
categories = ["gui"]

[dependencies]
eframe = "0.29"
engine = { path = "../engine" }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
