[package]
name = "engine"
version = "0.1.0"
edition = "2021"
description = "Disk scan and trash plan for Clean Your Mac"
license = "MIT"
keywords = ["macos", "disk-usage", "cleanup"]
categories = ["os", "filesystem"]

[dependencies]
async-trait = "0.1"
thiserror = "2"
sysinfo = "0.33"
tokio = { version = "1", features = ["fs", "macros", "rt", "sync", "time"] }
